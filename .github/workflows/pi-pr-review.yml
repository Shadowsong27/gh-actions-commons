name: pi PR Review (reusable)

# Shared pi.dev automated PR reviewer, packaged as a REUSABLE WORKFLOW
# rather than a composite action.
#
# Why a reusable workflow: the reviewer is fundamentally TWO jobs, and that split is a
# security boundary, not a layout preference. A composite action can only contribute
# steps to a single job, so packaging it that way would force every consumer to
# hand-maintain the boundary — and one repo forgetting `permissions:` silently hands a
# write-scoped token to a bash-capable agent running over attacker-influenceable diff
# content. Centralizing both jobs here makes that boundary un-droppable by consumers.
#
# Security posture:
#   - `review` runs the agent. Read-only `permissions`; scrubs the persisted checkout
#     credential from every .git/config before invoking pi; passes GITHUB_TOKEN="" to
#     the pi step. It never holds a write-scoped token.
#   - `post` publishes the comment and runs NO agent, so the write token is never
#     exposed to model-influenced code.
#   - `--no-approve` stops pi trusting PR-controlled project-local `.pi` resources
#     (extensions/skills) that would otherwise load before the tool denylist applies.
#   - `--exclude-tools edit,write` removes pi's mutation tools.
#
# KNOWN RESIDUAL [High]: pi keeps its `bash` tool, so a successful prompt injection can
# still run commands on the self-hosted runner (read host secrets, reach any network the
# runner can reach) despite the read-only GitHub token. The complete fix is to
# sandbox the agent step in a container/VM with no host credentials or network. Track
# this per-repo; adopting this workflow does not close it.
#
# Advisory by design: a green `review` check means THE JOB RAN, never "no findings".
# See the failure contract in ../../README.md.
#
# ---------------------------------------------------------------------------------------
# Cost gates (added later, both OPT-IN so existing callers are byte-for-byte unaffected):
#
#   Gate 1 — review only after CI is green. A caller that triggers on `workflow_run`
#   (its CI workflow completing) instead of `pull_request` spends NO model call until the
#   required CI workflow(s) concluded `success` on the reviewed commit. A failing
#   integration run concludes `failure`, so retries never trigger a review. Because each
#   repo has a DIFFERENT set of CI, the CI workflow name(s) live in the per-repo caller's
#   `on.workflow_run.workflows` list (and, for repos with more than one CI workflow, in
#   the `required-workflows` input). This shared workflow stays CI-agnostic — it is handed
#   the completed run and verifies the named workflow(s) are all green on that commit.
#
#   Gate 2 — skip trivial docs/ops PRs. When every changed file matches the caller's
#   `skip-paths` globs, the review is skipped (no model call). Empty by default (off).
#
# Rebuttal re-review (opt-in). A caller that also declares `workflow_dispatch` with a
# `pr-number` input lets an author ask for a fresh review of the SAME head commit after
# posting a rebuttal comment, with no new commit and no trigger comment. The reviewer
# reads the rebuttal through the prior-thread step and decides again. Bounded by
# `max-rebuttal-reviews`, and refused unless a trusted comment is newer than the last
# review of that commit.
#
# A single `gate` job resolves the PR and normalizes its context (number, head SHA, base
# ref) from a `pull_request` event (legacy callers, unchanged), a `workflow_run` event
# (gated callers) or a `workflow_dispatch` event (rebuttal re-review), so `review` and
# `post` are identical across all triggers.
# ---------------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      pi-models:
        description: >-
          Ordered, comma-separated model fallback chain, tried left to right. The first
          model yielding a usable review wins and is the one named in the published
          comment. Every name must be resolvable by the `pi` install on your runner.

          Prefer entries from DIFFERENT PROVIDERS rather than a retry of one model: the
          failure this absorbs is a provider-side quota or outage that can take
          minutes-to-hours to clear, which a same-model retry cannot rescue. Crossing API
          modes is fine and useful — that is precisely why failover lives in this workflow
          rather than in an upstream gateway, which cannot bridge modes mid-failover.

          REQUIRED and intentionally has no default: a default would silently apply one
          deployment's model names to every consumer, and the resulting failure surfaces
          as an opaque quota/auth error rather than as a configuration mistake.
        required: true
        type: string
      runs-on:
        description: >-
          Runner label. Must be a SELF-HOSTED runner with `pi` >= 0.80.10, node >= 22,
          and `pi` authenticated with a provider that resolves every name in
          `pi-models`. This cannot run on GitHub-hosted runners.
        required: false
        type: string
        default: self-hosted
      timeout-minutes:
        description: >-
          Timeout applied to BOTH jobs. `review` needs the headroom (it runs the agent);
          `post` finishes in seconds but must still be bounded, because on a self-hosted
          runner an untimed job holds a runner slot for GitHub's 360-minute default.
        required: false
        type: number
        default: 20
      repo-prompt-file:
        description: >-
          Optional path in the CALLING repo holding repo-specific review rules, appended
          to the shared prompt under a "Repository-specific rules" heading. Skipped
          silently when absent. The default filename is kept from the OpenCode reviewer
          so migrating repos keep their existing rules with no rename.
        required: false
        type: string
        default: .github/opencode-pr-review-prompt.md
      base-prompt-file:
        description: >-
          Optional path in the CALLING repo that REPLACES the shared base prompt wholesale.
          Leave empty to use the prompt bundled here (pi-review/pi-review-prompt.md), which
          is the recommended path — prefer `repo-prompt-file` for additive rules so shared
          improvements to the base prompt keep reaching you.
        required: false
        type: string
        default: ""
      commons-ref:
        description: >-
          Fallback ref for fetching this repo's bundled prompt/extractor. Normally unused:
          the checkout first pins `job.workflow_sha`, the exact commit of THIS workflow
          file, so the assets match the workflow version the caller pinned. This input is
          consulted only when that pinned checkout does not succeed (the context value is
          unavailable on GitHub Enterprise Server and on older runners).
        required: false
        type: string
        default: main
      required-workflows:
        description: >-
          Gate 1 (workflow_run mode only). Space- or comma-separated CI workflow NAMES
          (the `name:` field, not the filename) that must ALL have a successful run on the
          reviewed commit before a model call is spent. Empty (default) means "the workflow
          that triggered this event", which is correct for a repo with a SINGLE CI
          workflow. A repo with MULTIPLE CI workflows MUST list every one here, otherwise
          the review fires as soon as the first goes green. Ignored in pull_request mode.
        required: false
        type: string
        default: ""
      skip-paths:
        description: >-
          Gate 2. Newline- or comma-separated globs. When EVERY file changed in the PR
          matches one of them, the review is skipped with no model call (trivial docs/ops
          change). Globs support `*`, `?` and `**`. A PR touching any non-matching file is
          always reviewed. Empty (default) disables the skip, so existing callers are
          unaffected until they opt in.
        required: false
        type: string
        default: ""
      pr-number:
        description: >-
          Rebuttal re-review (workflow_dispatch mode only). The PR to re-review. The
          caller forwards its own `workflow_dispatch` input here; leave it unset for
          every other trigger.
        required: false
        type: string
        default: ""
      max-rebuttal-reviews:
        description: >-
          Rebuttal re-review cap. How many dispatched re-reviews one head commit may get
          on top of its first review. A new commit resets the count.
        required: false
        type: number
        default: 1
      skip-comment:
        description: >-
          When true (default), a PR skipped by Gate 2 gets one short note comment
          (upserted, so it never spams the thread) so the skip is visible and auditable.
          Set false to skip silently.
        required: false
        type: boolean
        default: true
      claude-fallback-model:
        description: >-
          Claude fallback (opt-in). When set, and EVERY model in `pi-models` failed, a
          separate job reviews the PR with `claude -p` on this model, using the Claude
          subscription token passed as the `CLAUDE_CODE_OAUTH_TOKEN` secret. It reads
          the exact prompt and diff pi was given, so both reviewers share one prompt.
          Its review is published as the normal review comment, naming the model.
          Empty (default) disables it, so existing callers are unaffected.
        required: false
        type: string
        default: ""
      claude-fallback-effort:
        description: Claude fallback effort level (low, medium, high, xhigh, max).
        required: false
        type: string
        default: high
      claude-code-version:
        description: >-
          Exact `@anthropic-ai/claude-code` npm version the fallback runs. Pinned, not
          `latest`, so a CLI release cannot change the review's tool permissions
          unannounced. Must be new enough to know `claude-fallback-model`.
        required: false
        type: string
        default: "2.1.286"
      claude-first:
        description: >-
          Claude-first order (opt-in). When true and `claude-fallback-model` is set,
          Claude reviews FIRST and the `pi-models` chain runs only if Claude gives no
          usable review (a later `pi-after-claude` job). The prompt, diff, Claude job
          and its hardening are unchanged; only the order flips. False (default) keeps
          pi first and Claude as the last resort.
        required: false
        type: boolean
        default: false
      pi-attempt-timeout-minutes:
        description: >-
          Time limit for ONE pi model attempt, so a hung model falls through to the next
          one instead of using up the whole job timeout. 0 (default) splits the job
          budget evenly: (timeout-minutes - 3) / number of models, at least 2 minutes.
        required: false
        type: number
        default: 0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: >-
          Claude subscription token from `claude setup-token`. Needed only when
          `claude-fallback-model` is set.
        required: false

# Superseded runs are cancelled here so a push mid-review doesn't publish a comment for
# an outdated commit. The key falls back across trigger modes: `pull_request` carries the
# PR number; `workflow_run` carries only the head branch (one PR per branch on same-repo
# PRs), which is enough to collapse the two workflow_run events a two-CI-workflow repo
# fires for one commit into a single review.
#
# The group name is deliberately NOT `pi-review-<n>` — that is the group the standalone
# (pre-reusable) workflow used, and a repo migrating by pasting its old `concurrency:`
# block into the caller would then share a group with this workflow. GitHub treats that
# as a DEADLOCK: the caller run holds the group while the called run waits for it, and
# neither ever starts. Keeping a distinct, called-workflow-specific name makes that
# collision impossible regardless of what the caller declares.
concurrency:
  group: pi-review-reusable-${{ github.repository }}-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || inputs.pr-number }}
  cancel-in-progress: true

jobs:
  # Cheap, read-only classification. Resolves the PR and normalizes its context from
  # whichever event fired, enforces Gate 1 (CI green, workflow_run mode) and Gate 2
  # (docs-only skip), and emits the decision. Runs NO agent and touches only the API.
  gate:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    outputs:
      should_review: ${{ steps.decide.outputs.should_review }}
      skip_reason: ${{ steps.decide.outputs.skip_reason }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      base_ref: ${{ steps.decide.outputs.base_ref }}
    steps:
      - name: Decide whether to review
        id: decide
        uses: actions/github-script@v7
        env:
          REQUIRED_WORKFLOWS: ${{ inputs.required-workflows }}
          SKIP_PATHS: ${{ inputs.skip-paths }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr-number }}
          MAX_REBUTTAL_REVIEWS: ${{ inputs.max-rebuttal-reviews }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo
            const repoFull = `${owner}/${repo}`
            const evtName = context.eventName

            const setOut = (o) => {
              core.setOutput("should_review", o.should_review ? "true" : "false")
              core.setOutput("skip_reason", o.skip_reason || "")
              core.setOutput("pr_number", o.pr_number != null ? String(o.pr_number) : "")
              core.setOutput("head_sha", o.head_sha || "")
              core.setOutput("base_ref", o.base_ref || "")
              core.info(
                `gate: should_review=${!!o.should_review} reason=${o.skip_reason || "(review)"} ` +
                `pr=${o.pr_number || "-"} sha=${(o.head_sha || "-").slice(0, 12)}`
              )
            }

            const parseList = (s) =>
              (s || "").split(/[\n,]/).map((x) => x.trim()).filter(Boolean)

            // Minimal, path-aware glob matcher: `*` and `?` stay within a segment; `**`
            // (and a following `/`) crosses segments. Anchored full-string.
            const globToRe = (glob) => {
              let re = ""
              for (let i = 0; i < glob.length; i++) {
                const c = glob[i]
                if (c === "*") {
                  if (glob[i + 1] === "*") {
                    re += ".*"
                    i++
                    if (glob[i + 1] === "/") i++
                  } else {
                    re += "[^/]*"
                  }
                } else if (c === "?") {
                  re += "[^/]"
                } else if (".+^${}()|[]\\".includes(c)) {
                  re += "\\" + c
                } else {
                  re += c
                }
              }
              return new RegExp("^" + re + "$")
            }

            let headSha, prNumber, baseRef, draft, sameRepo, prState

            if (evtName === "workflow_run") {
              const run = context.payload.workflow_run
              // Only PR-triggered CI runs are reviewable, and only successful ones.
              if (run.event !== "pull_request") {
                return setOut({ should_review: false, skip_reason: "not-a-pr-ci-run", head_sha: run.head_sha })
              }
              headSha = run.head_sha
              if (run.conclusion !== "success") {
                return setOut({ should_review: false, skip_reason: "ci-not-green", head_sha: headSha })
              }

              // Resolve the open PR whose head is this commit.
              let prs = []
              try {
                const r = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner, repo, commit_sha: headSha,
                })
                prs = r.data || []
              } catch (e) {
                core.warning(`PR lookup failed: ${e.message}`)
              }
              const pr =
                prs.find((p) => p.state === "open" && p.head && p.head.sha === headSha) ||
                prs.find((p) => p.state === "open") ||
                prs[0]
              if (!pr) {
                return setOut({ should_review: false, skip_reason: "no-pr-for-commit", head_sha: headSha })
              }
              prNumber = pr.number
              baseRef = pr.base.ref
              draft = pr.draft
              sameRepo = pr.head && pr.head.repo && pr.head.repo.full_name === repoFull
              prState = pr.state

              // Gate 1: every required workflow must be GREEN on this exact commit.
              // Re-querying (rather than trusting only the triggering run) is what makes
              // a two-CI-workflow repo wait for BOTH, and survives a manual CI re-run.
              const required = parseList(process.env.REQUIRED_WORKFLOWS)
              const names = required.length ? required : [run.name]
              let runs = []
              try {
                runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                  owner, repo, head_sha: headSha, event: "pull_request", per_page: 100,
                })
              } catch (e) {
                core.warning(`workflow-run lookup failed: ${e.message}`)
              }
              for (const name of names) {
                const forWf = runs
                  .filter((r) => r.name === name && r.status === "completed")
                  .sort((a, b) => (b.run_number || 0) - (a.run_number || 0))
                if (!forWf.length || forWf[0].conclusion !== "success") {
                  return setOut({
                    should_review: false, skip_reason: "ci-not-green",
                    pr_number: prNumber, head_sha: headSha, base_ref: baseRef,
                  })
                }
              }
            } else if (evtName === "pull_request") {
              const pr = context.payload.pull_request
              headSha = pr.head.sha
              prNumber = pr.number
              baseRef = pr.base.ref
              draft = pr.draft
              sameRepo = pr.head.repo.full_name === repoFull
              prState = pr.state
              // Gate 1 is not applied here: CI has not finished at push time. Legacy
              // pull_request callers keep their existing "review every push" behavior.
            } else if (evtName === "workflow_dispatch") {
              // Rebuttal re-review: review the PR's CURRENT head again so the reviewer
              // can weigh a rebuttal posted since its last review.
              const raw = (process.env.DISPATCH_PR_NUMBER || "").trim()
              if (!/^[1-9][0-9]*$/.test(raw)) {
                return setOut({ should_review: false, skip_reason: "invalid-pr-number" })
              }
              let pr
              try {
                pr = (await github.rest.pulls.get({ owner, repo, pull_number: Number(raw) })).data
              } catch (e) {
                core.warning(`PR lookup failed: ${e.message}`)
                return setOut({ should_review: false, skip_reason: "no-pr-for-number" })
              }
              headSha = pr.head.sha
              prNumber = pr.number
              baseRef = pr.base.ref
              draft = pr.draft
              sameRepo = pr.head.repo && pr.head.repo.full_name === repoFull
              prState = pr.state

              // Gate 1 still holds: CI must be green on the head. With no named
              // workflows, every pull_request-event workflow on the head must be green
              // (there is no triggering run to name), and at least one must succeed.
              // The reviewer's own caller is excluded (a pull_request-triggered caller
              // has runs on the head too), and `skipped` / `neutral` count as passing
              // so a job-level `if:` does not block a re-review. A repo with NO
              // pull_request workflow besides the reviewer has no CI to wait for, so
              // the dispatch follows the legacy pull_request behavior and reviews.
              // A run lookup that fails is never read as "no CI": it refuses.
              let runs = []
              try {
                runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                  owner, repo, head_sha: headSha, event: "pull_request", per_page: 100,
                })
              } catch (e) {
                core.warning(`workflow-run lookup failed: ${e.message}`)
                return setOut({
                  should_review: false, skip_reason: "ci-lookup-failed",
                  pr_number: prNumber, head_sha: headSha, base_ref: baseRef,
                })
              }
              const required = parseList(process.env.REQUIRED_WORKFLOWS)
              const names = required.length
                ? required
                : [...new Set(runs.map((r) => r.name))].filter((n) => n !== context.workflow)
              const PASSING = new Set(["success", "skipped", "neutral"])
              const latest = names.map((name) => runs
                .filter((r) => r.name === name)
                .sort((a, b) => (b.run_number || 0) - (a.run_number || 0))[0])
              const noPrCi = !required.length && names.length === 0
              const green = noPrCi || (
                latest.every((r) => r && r.status === "completed" && PASSING.has(r.conclusion)) &&
                latest.some((r) => r.conclusion === "success")
              )
              if (!green) {
                return setOut({
                  should_review: false, skip_reason: "ci-not-green",
                  pr_number: prNumber, head_sha: headSha, base_ref: baseRef,
                })
              }
            } else {
              return setOut({ should_review: false, skip_reason: `unsupported-event-${evtName}` })
            }

            // Common reviewability guards (same as the historical review-job `if`).
            if (prState !== "open" || draft || !sameRepo) {
              return setOut({
                should_review: false, skip_reason: "not-reviewable",
                pr_number: prNumber, head_sha: headSha, base_ref: baseRef,
              })
            }

            // Idempotency (workflow_run mode only, to leave legacy behavior untouched):
            // do not re-spend on a commit whose SUCCESSFUL review is already posted. This
            // collapses the two workflow_run events a two-CI-workflow repo fires, and
            // suppresses re-review on a manual CI re-run. A prior FAILED review does not
            // count — that must be retried.
            if (evtName === "workflow_run") {
              try {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: prNumber, per_page: 100,
                })
                const reviewed = comments.some((c) =>
                  c.user && c.user.login === "github-actions[bot]" &&
                  (c.body || "").includes("<!-- pi-pr-review -->") &&
                  (c.body || "").includes(`Reviewed commit: ${headSha}`) &&
                  !(c.body || "").includes("<!-- pi-pr-review-failed -->")
                )
                if (reviewed) {
                  return setOut({
                    should_review: false, skip_reason: "already-reviewed",
                    pr_number: prNumber, head_sha: headSha, base_ref: baseRef,
                  })
                }
              } catch (e) {
                core.warning(`comment scan failed: ${e.message}`)
              }
            }

            // Rebuttal re-review guards (workflow_dispatch mode only). Fail closed: a
            // comment list that cannot be read spends no model call.
            if (evtName === "workflow_dispatch") {
              let comments
              try {
                comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: prNumber, per_page: 100,
                })
              } catch (e) {
                core.warning(`comment scan failed: ${e.message}`)
                return setOut({
                  should_review: false, skip_reason: "comment-scan-failed",
                  pr_number: prNumber, head_sha: headSha, base_ref: baseRef,
                })
              }
              const isBot = (c) => c.user && c.user.login === "github-actions[bot]"
              const reviewsOfHead = comments.filter((c) =>
                isBot(c) &&
                (c.body || "").includes("<!-- pi-pr-review -->") &&
                (c.body || "").includes(`Reviewed commit: ${headSha}`) &&
                !(c.body || "").includes("<!-- pi-pr-review-failed -->")
              )
              if (reviewsOfHead.length) {
                const cap = Number(process.env.MAX_REBUTTAL_REVIEWS || "1")
                // The first review of a commit is not a re-review.
                if (reviewsOfHead.length - 1 >= cap) {
                  return setOut({
                    should_review: false, skip_reason: "rebuttal-cap-reached",
                    pr_number: prNumber, head_sha: headSha, base_ref: baseRef,
                  })
                }
                // Only a trusted comment newer than the last review is a rebuttal the
                // reviewer has not yet seen. Same trust set as the prior-thread step.
                const TRUSTED_ASSOC = new Set(["OWNER", "MEMBER", "COLLABORATOR"])
                const last = reviewsOfHead[reviewsOfHead.length - 1]
                const rebutted = comments.some((c) =>
                  !isBot(c) &&
                  TRUSTED_ASSOC.has(c.author_association) &&
                  new Date(c.created_at) > new Date(last.created_at)
                )
                if (!rebutted) {
                  return setOut({
                    should_review: false, skip_reason: "no-new-rebuttal",
                    pr_number: prNumber, head_sha: headSha, base_ref: baseRef,
                  })
                }
              }
            }

            // Gate 2: skip when EVERY changed file matches a skip glob.
            const skipGlobs = parseList(process.env.SKIP_PATHS)
            if (skipGlobs.length) {
              let files = []
              try {
                files = await github.paginate(github.rest.pulls.listFiles, {
                  owner, repo, pull_number: prNumber, per_page: 100,
                })
              } catch (e) {
                core.warning(`file list failed: ${e.message}`)
              }
              const paths = files.map((f) => f.filename)
              const res = skipGlobs.map(globToRe)
              const allSkippable = paths.length > 0 && paths.every((p) => res.some((re) => re.test(p)))
              if (allSkippable) {
                return setOut({
                  should_review: false, skip_reason: "docs-only",
                  pr_number: prNumber, head_sha: headSha, base_ref: baseRef,
                })
              }
            }

            return setOut({
              should_review: true, skip_reason: "",
              pr_number: prNumber, head_sha: headSha, base_ref: baseRef,
            })

  review:
    needs: gate
    if: needs.gate.outputs.should_review == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout the reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0

      # Fetch the shared prompt + extractor, PINNED to the exact commit of this
      # reusable workflow so they can never drift from the logic consuming them —
      # a caller on @v1 gets v1's prompt, not main's.
      #
      # `job.workflow_sha` is "the commit SHA of the workflow file that defines the
      # current job", which for a called workflow is this file. It is deliberately
      # attempted rather than trusted: it is unavailable on GitHub Enterprise Server,
      # absent on older runners, and not yet in actionlint's context model. Rather
      # than bet every consumer on it resolving correctly, the pin is allowed to fail
      # and the next step falls back to `commons-ref`. Failure is loud in the log but
      # never fatal.
      - name: Fetch shared reviewer assets (pinned to this workflow's commit)
        id: assets-pinned
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Shadowsong27/gh-actions-commons
          ref: ${{ job.workflow_sha }}
          path: .gha-commons
          persist-credentials: false

      - name: Fetch shared reviewer assets (fallback ref)
        if: steps.assets-pinned.outcome != 'success'
        uses: actions/checkout@v4
        with:
          repository: Shadowsong27/gh-actions-commons
          ref: ${{ inputs.commons-ref }}
          path: .gha-commons
          persist-credentials: false

      - name: Stage reviewer assets outside the reviewed tree
        run: |
          set -euo pipefail
          # Fail loudly if neither checkout produced the assets. Continuing here would
          # mean reviewing with no prompt, which reads as a bad review rather than a
          # broken install — exactly the silent failure this reviewer exists to avoid.
          for f in pi-review/pi-review-prompt.md pi-review/pi-extract-review.py; do
            if [ ! -f ".gha-commons/$f" ]; then
              echo "::error::shared reviewer asset '$f' missing — the gh-actions-commons checkout failed or the ref is wrong" >&2
              exit 1
            fi
          done
          cp .gha-commons/pi-review/pi-review-prompt.md  "$RUNNER_TEMP/base-prompt.md"
          cp .gha-commons/pi-review/pi-extract-review.py "$RUNNER_TEMP/pi-extract-review.py"
          # Remove the commons checkout before the agent runs. Two reasons: it keeps the
          # reviewed working tree clean (the agent must not mistake commons files for
          # repo files, nor report findings about them), and it removes a second
          # .git directory from the agent's reach.
          rm -rf .gha-commons

      - name: Generate PR diff
        env:
          BASE_REF: ${{ needs.gate.outputs.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          git diff --merge-base "origin/$BASE_REF" HEAD > "$RUNNER_TEMP/pr.diff"
          echo "diff lines: $(wc -l < "$RUNNER_TEMP/pr.diff")"

      - name: Fetch prior review thread
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs")
            const out = process.env.RUNNER_TEMP + "/prior-thread.md"
            const marker = "<!-- pi-pr-review -->"
            const { owner, repo } = context.repo
            const issue_number = Number(process.env.PR_NUMBER)
            let comments = []
            try {
              comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              })
            } catch (e) {
              core.warning(`Could not fetch prior comments: ${e.message}`)
              fs.writeFileSync(out, "")
              return
            }
            // Trust boundary: these comments are fed into the
            // bash-capable agent's prompt. On a PUBLIC repo anyone can comment,
            // so only ingest pi's own prior reviews (posted by github-actions[bot])
            // and comments from repo members/owners/collaborators — drop untrusted
            // external comments that could prompt-inject the agent. author_association
            // is computed by GitHub and cannot be spoofed by an external commenter.
            // (No-op on private repos, where every commenter already has repo access.)
            const TRUSTED_ASSOC = new Set(["OWNER", "MEMBER", "COLLABORATOR"])
            const trusted = comments.filter(c =>
              (c.user && c.user.login === "github-actions[bot]") ||
              TRUSTED_ASSOC.has(c.author_association)
            )
            // Keep the most recent 30 to bound prompt size.
            const rendered = trusted.slice(-30).map(c => {
              const who = (c.user && c.user.login) || "unknown"
              const kind = (c.body || "").includes(marker) ? "prior pi review" : "reply / other review"
              return `#### @${who} — ${kind} (${c.created_at})\n\n${(c.body || "").trim()}`
            }).join("\n\n---\n\n")
            // Cap the rendered thread: the prompt is passed as a single argv, so an
            // unbounded thread could exceed Linux MAX_ARG_STRLEN and make pi fail
            // (falling back to an empty review — the exact failure we're avoiding).
            // Keep the TAIL (newest comments) — recent triage/rebuttals are what
            // convergence depends on; dropping them would re-raise settled findings.
            const CAP = 24000
            const capped = rendered.length > CAP
              ? "_[older prior-thread truncated to bound prompt size]_\n\n" + rendered.slice(-CAP)
              : rendered
            fs.writeFileSync(out, capped)

      - name: Scrub checkout credential before running the agent
        run: |
          # Remove the persisted GitHub token so the bash-enabled agent cannot read
          # it out of .git/config. (The job token is read-only anyway; belt + braces.)
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git submodule foreach --recursive 'git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true' || true

      - name: Build prompt
        env:
          BASE_PROMPT_FILE: ${{ inputs.base-prompt-file }}
          REPO_PROMPT_FILE: ${{ inputs.repo-prompt-file }}
        run: |
          set -euo pipefail
          # Base prompt: the caller's override if it declared one, else the shared prompt.
          # A declared-but-missing override is a wiring mistake, so fail loudly rather
          # than silently reviewing with the wrong prompt.
          if [ -n "$BASE_PROMPT_FILE" ]; then
            if [ ! -f "$BASE_PROMPT_FILE" ]; then
              echo "::error::base-prompt-file '$BASE_PROMPT_FILE' not found in the repo" >&2
              exit 1
            fi
            cat "$BASE_PROMPT_FILE" > "$RUNNER_TEMP/prompt.md"
          else
            cat "$RUNNER_TEMP/base-prompt.md" > "$RUNNER_TEMP/prompt.md"
          fi
          # Repo-specific rules are optional and additive — absent is the normal case.
          if [ -n "$REPO_PROMPT_FILE" ] && [ -f "$REPO_PROMPT_FILE" ]; then
            printf '\n## Repository-specific rules\n\n' >> "$RUNNER_TEMP/prompt.md"
            cat "$REPO_PROMPT_FILE" >> "$RUNNER_TEMP/prompt.md"
          fi
          # Append the prior review thread so pi honors settled findings (no re-raising).
          if [ -s "$RUNNER_TEMP/prior-thread.md" ]; then
            printf '\n## Prior review thread\n\nThese are earlier comments on this PR — your own previous reviews and any replies. Apply the "Honor prior triage" rule: do not re-raise a finding already credibly rebutted or addressed unless the diff has since changed.\n\n' >> "$RUNNER_TEMP/prompt.md"
            cat "$RUNNER_TEMP/prior-thread.md" >> "$RUNNER_TEMP/prompt.md"
          fi

      - name: Run pi review
        continue-on-error: true
        env:
          GITHUB_TOKEN: ""
          PI_MODELS: ${{ inputs.pi-models }}
          CLAUDE_FIRST: ${{ inputs.claude-first && inputs.claude-fallback-model != '' }}
          JOB_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
          PI_ATTEMPT_TIMEOUT_MINUTES: ${{ inputs.pi-attempt-timeout-minutes }}
        run: |
          set -o pipefail
          # Agentic review over the repo checkout (pi's read + bash tools, minus
          # edit/write). --no-approve ignores PR-controlled project-local pi
          # resources. Diff is fed on stdin (verified consumed by `pi -p`).
          #
          # Walk PI_MODELS in order and stop at the first attempt whose extraction
          # exits 0 (the extractor is the single authority on "usable").
          # Record which model actually answered so the comment can name it rather
          # than the configured default.
          #
          # This exact script runs in two jobs: `review` (pi first) and
          # `pi-after-claude` (claude-first mode, after Claude gave no usable review).
          IFS=',' read -ra _raw <<< "$PI_MODELS"
          _models=()
          for _m in "${_raw[@]}"; do
            _m="$(echo "$_m" | xargs)"
            [ -n "$_m" ] && _models+=("$_m")
          done
          # Claude-first: Claude reviews first (claude-fallback job) and this chain runs
          # later in pi-after-claude only if Claude gave no usable review. The NONE line
          # is what tells the Claude job to run.
          if [ "${CLAUDE_FIRST:-false}" = "true" ]; then
            printf 'NONE — claude-first: pi runs only if Claude gives no review' > "$RUNNER_TEMP/pi-model.txt"
            echo "claude-first: pi skipped here, Claude reviews first"
            exit 0
          fi
          # Written BEFORE the loop: if the job is killed mid-attempt (job timeout), the
          # Claude fallback still sees a chain with no answer and runs.
          printf 'NONE — no model finished: %s' "$PI_MODELS" > "$RUNNER_TEMP/pi-model.txt"
          # Per-attempt limit: a hung model must fall through, not use up the job timeout.
          if [ "${PI_ATTEMPT_TIMEOUT_MINUTES:-0}" != "0" ]; then
            _limit="${PI_ATTEMPT_TIMEOUT_MINUTES}m"
          else
            _n=${#_models[@]}
            [ "$_n" -lt 1 ] && _n=1
            _secs=$(( (${JOB_TIMEOUT_MINUTES:-20} * 60 - 180) / _n ))
            [ "$_secs" -lt 120 ] && _secs=120
            _limit="${_secs}s"
          fi
          used=""
          for _m in "${_models[@]}"; do
            echo "::group::pi attempt — $_m (limit $_limit)"
            _rc=0
            timeout --kill-after=30s "$_limit" \
              pi -p --mode json --no-session --no-approve --exclude-tools edit,write \
              --model "$_m" \
              "$(cat "$RUNNER_TEMP/prompt.md")" \
              < "$RUNNER_TEMP/pr.diff" \
              > "$RUNNER_TEMP/pi-events.jsonl" || _rc=$?
            if [ "$_rc" = 124 ] || [ "$_rc" = 137 ]; then
              echo "pi attempt timed out after $_limit"
            elif [ "$_rc" != 0 ]; then
              echo "pi exited non-zero (see events)"
            fi
            if python3 "$RUNNER_TEMP/pi-extract-review.py" "$RUNNER_TEMP/pi-events.jsonl" \
                 > "$RUNNER_TEMP/pi-review.md"; then
              used="$_m"
              echo "::endgroup::"
              echo "usable review from $_m"
              break
            fi
            echo "::endgroup::"
            echo "no usable review from $_m — falling through to the next model"
          done
          # On total exhaustion pi-review.md holds the LAST attempt's failure body,
          # so the failure signal (marker + banner + cause) still reaches the comment.
          if [ -n "$used" ]; then
            printf '%s' "$used" > "$RUNNER_TEMP/pi-model.txt"
          else
            printf 'NONE — every model failed: %s' "$PI_MODELS" > "$RUNNER_TEMP/pi-model.txt"
          fi
          echo "model used: $(cat "$RUNNER_TEMP/pi-model.txt")"
          echo "review chars: $(wc -c < "$RUNNER_TEMP/pi-review.md")"

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-review-${{ needs.gate.outputs.pr_number }}
          # prompt.md + pr.diff let the Claude fallback review the exact input pi got.
          path: |
            ${{ runner.temp }}/pi-review.md
            ${{ runner.temp }}/pi-model.txt
            ${{ runner.temp }}/prompt.md
            ${{ runner.temp }}/pr.diff
            ${{ runner.temp }}/pi-extract-review.py
          retention-days: 3
          if-no-files-found: warn

  # Claude fallback (opt-in via `claude-fallback-model`). Runs only when the pi chain
  # was exhausted: pi-model.txt starts with "NONE". A quota outage and an unregistered
  # model fail identically in pi, so this fires on "every pi model failed", not on
  # quota specifically. It is a SEPARATE job so the subscription token never shares a
  # job (and its process tree) with the bash-capable pi agent.
  #
  # Hardening. The agent has the same tool access as pi: Read, Grep, Glob and Bash.
  # Edits, web and subagents are denied.
  #   - Read-only GITHUB_TOKEN; checkout credential not persisted.
  #   - CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1: every Bash command runs in a bubblewrap
  #     sandbox with its own PID namespace, and the CLI strips its credentials
  #     (CLAUDE_CODE_OAUTH_TOKEN among them) from the command's environment. So a
  #     prompt injection cannot read the token from its env or from
  #     /proc/*/environ of the CLI or this step's shell. The runner needs
  #     `bubblewrap` and `socat`, and a ~/.config the runner user can write;
  #     the step fails loudly without them.
  #   - KNOWN RESIDUAL [High], the same as pi's: Bash can read files the runner user
  #     can read, such as ~/.ssh and ~/.config/gh, and can reach the network.
  #   - `--safe-mode` disables every PR-controllable customization: hooks (shell
  #     commands with the token in env), skills, CLAUDE.md, agents, MCP.
  #     `--setting-sources user` and an empty CLAUDE_CONFIG_DIR are a second layer.
  #   - The CLI is installed from $RUNNER_TEMP, so a PR-supplied `.npmrc` cannot
  #     redirect the npm registry while the token is in the environment.
  #   - The output is checked for the token before it leaves this job.
  claude-fallback:
    needs: [gate, review]
    if: >-
      ${{ !cancelled() && inputs.claude-fallback-model != '' &&
      needs.gate.result == 'success' && needs.review.result != 'skipped' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Download pi review artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pi-review-${{ needs.gate.outputs.pr_number }}
          path: ${{ runner.temp }}/pi

      - name: Decide whether pi exhausted every model
        id: decide
        run: |
          d="$RUNNER_TEMP/pi"
          if [ -f "$d/pi-model.txt" ] && grep -q '^NONE' "$d/pi-model.txt" \
             && [ -s "$d/prompt.md" ] && [ -f "$d/pr.diff" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "pi has no review (chain exhausted, or claude-first) — running Claude"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "pi produced a review, or left no prompt/diff — no fallback"
          fi

      - name: Checkout the reviewed commit
        if: steps.decide.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          persist-credentials: false

      - name: Run Claude review
        if: steps.decide.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ""
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ inputs.claude-fallback-model }}
          CLAUDE_EFFORT: ${{ inputs.claude-fallback-effort }}
          CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
          CLAUDE_FIRST: ${{ inputs.claude-first }}
          JOB_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::claude-fallback-model is set but the CLAUDE_CODE_OAUTH_TOKEN secret is not passed"
            exit 1
          fi
          # Subscription only: an API key or base URL set on the runner would take
          # precedence over the OAuth token and bill (or route) the review elsewhere.
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN ANTHROPIC_BASE_URL
          # Leave time for the steps after this one, and for pi-after-claude in
          # claude-first mode, instead of being killed by the job timeout.
          _secs=$(( ${JOB_TIMEOUT_MINUTES:-20} * 60 - 180 ))
          [ "$_secs" -lt 120 ] && _secs=120
          # Bash runs sandboxed with credentials stripped (see the job header). The
          # sandbox needs bubblewrap and socat; without them the CLI exits, so fail
          # here with a clear message instead.
          for _bin in bwrap socat; do
            if ! command -v "$_bin" >/dev/null 2>&1; then
              echo "::error::the Claude review needs '$_bin' on the runner (apt-get install -y bubblewrap socat)"
              exit 1
            fi
          done
          # The sandbox mounts protected paths read-only, several under ~/.config (git,
          # pip, gh, glab-cli). bwrap creates a missing mount point itself, so the runner
          # user must be able to write ~/.config. Without that, every Bash call fails.
          mkdir -p "$HOME/.config" 2>/dev/null || true
          if [ ! -w "$HOME/.config" ]; then
            echo "::error::the Claude review needs $HOME/.config writable by the runner user (chown $(id -un) $HOME/.config)"
            exit 1
          fi
          export CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1
          # Install outside the checkout: npm reads a project .npmrc from its cwd.
          ( cd "$RUNNER_TEMP" && npm install --silent --no-audit --no-fund \
              --prefix "$RUNNER_TEMP/claude-cli" "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" )
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-config"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          # The prompt goes BEFORE the tool flags: they are variadic and would
          # swallow a trailing positional argument. The diff arrives on stdin.
          timeout --kill-after=30s "${_secs}s" \
          "$RUNNER_TEMP/claude-cli/node_modules/.bin/claude" -p "$(cat "$RUNNER_TEMP/pi/prompt.md")" \
            --model "$CLAUDE_MODEL" \
            --effort "$CLAUDE_EFFORT" \
            --output-format json \
            --safe-mode \
            --setting-sources user \
            --strict-mcp-config \
            --disable-slash-commands \
            --allowedTools "Read(./**)" "Grep" "Glob" "Bash" \
            --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch,Task,Agent,Read(//proc/**)" \
            < "$RUNNER_TEMP/pi/pr.diff" \
            > "$RUNNER_TEMP/claude-result.json" || echo "claude exited non-zero"
          # Usable = a non-error result carrying the prompt's `## Findings` section.
          # Append token usage in the same shape as pi's reviews.
          python3 - "$RUNNER_TEMP/claude-result.json" "$RUNNER_TEMP/claude-review.md" <<'PY'
          import json, sys
          try:
              j = json.load(open(sys.argv[1]))
          except Exception as e:
              sys.exit(f"no parseable claude output: {e}")
          text = (j.get("result") or "").strip()
          if j.get("is_error") or "## Findings" not in text:
              sys.exit(f"no usable claude review (is_error={j.get('is_error')}, chars={len(text)})")
          u = j.get("usage") or {}
          i, o = u.get("input_tokens", 0), u.get("output_tokens", 0)
          cr, cw = u.get("cache_read_input_tokens", 0), u.get("cache_creation_input_tokens", 0)
          open(sys.argv[2], "w").write("\n".join([
              text, "", "### Token Usage", "",
              f"Input tokens: `{i}`", f"Output tokens: `{o}`", "Reasoning tokens: `0`",
              f"Cache read tokens: `{cr}`", f"Cache write tokens: `{cw}`",
              f"Total tokens: `{i + o + cr + cw}`",
          ]) + "\n")
          PY
          if grep -qF "$CLAUDE_CODE_OAUTH_TOKEN" "$RUNNER_TEMP/claude-review.md"; then
            echo "::error::review output contains the OAuth token — refusing to publish"
            rm -f "$RUNNER_TEMP/claude-review.md"
            exit 1
          fi
          if [ "${CLAUDE_FIRST:-false}" = "true" ]; then
            printf '%s (Claude, effort %s)' "$CLAUDE_MODEL" "$CLAUDE_EFFORT" > "$RUNNER_TEMP/claude-model.txt"
          else
            printf '%s (Claude fallback, effort %s)' "$CLAUDE_MODEL" "$CLAUDE_EFFORT" > "$RUNNER_TEMP/claude-model.txt"
          fi
          echo "review chars: $(wc -c < "$RUNNER_TEMP/claude-review.md")"

      - name: Upload Claude review artifact
        if: steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-${{ needs.gate.outputs.pr_number }}
          path: |
            ${{ runner.temp }}/claude-review.md
            ${{ runner.temp }}/claude-model.txt
          retention-days: 3
          if-no-files-found: ignore

  # Claude-first mode only: the pi chain as the fallback for Claude. Runs the SAME
  # pi step as `review` (a test pins the two scripts equal) on the prompt and diff the
  # review job built, and only when Claude produced no usable review.
  pi-after-claude:
    needs: [gate, review, claude-fallback]
    if: >-
      ${{ !cancelled() && inputs.claude-first && inputs.claude-fallback-model != '' &&
      needs.gate.result == 'success' && needs.review.result != 'skipped' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Download Claude review artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: claude-review-${{ needs.gate.outputs.pr_number }}
          path: ${{ runner.temp }}/claude

      - name: Download pi review artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pi-review-${{ needs.gate.outputs.pr_number }}
          path: ${{ runner.temp }}

      - name: Decide whether Claude answered
        id: decide
        run: |
          if [ -s "$RUNNER_TEMP/claude/claude-review.md" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Claude produced a review — pi not needed"
          elif [ -s "$RUNNER_TEMP/prompt.md" ] && [ -f "$RUNNER_TEMP/pr.diff" ] \
               && [ -f "$RUNNER_TEMP/pi-extract-review.py" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Claude gave no usable review — running the pi chain"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no prompt/diff/extractor from the review job — cannot run pi"
          fi

      - name: Checkout the reviewed commit
        if: steps.decide.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run pi review
        if: steps.decide.outputs.run == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ""
          PI_MODELS: ${{ inputs.pi-models }}
          CLAUDE_FIRST: "false"
          JOB_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
          PI_ATTEMPT_TIMEOUT_MINUTES: ${{ inputs.pi-attempt-timeout-minutes }}
        run: |
          set -o pipefail
          # Agentic review over the repo checkout (pi's read + bash tools, minus
          # edit/write). --no-approve ignores PR-controlled project-local pi
          # resources. Diff is fed on stdin (verified consumed by `pi -p`).
          #
          # Walk PI_MODELS in order and stop at the first attempt whose extraction
          # exits 0 (the extractor is the single authority on "usable").
          # Record which model actually answered so the comment can name it rather
          # than the configured default.
          #
          # This exact script runs in two jobs: `review` (pi first) and
          # `pi-after-claude` (claude-first mode, after Claude gave no usable review).
          IFS=',' read -ra _raw <<< "$PI_MODELS"
          _models=()
          for _m in "${_raw[@]}"; do
            _m="$(echo "$_m" | xargs)"
            [ -n "$_m" ] && _models+=("$_m")
          done
          # Claude-first: Claude reviews first (claude-fallback job) and this chain runs
          # later in pi-after-claude only if Claude gave no usable review. The NONE line
          # is what tells the Claude job to run.
          if [ "${CLAUDE_FIRST:-false}" = "true" ]; then
            printf 'NONE — claude-first: pi runs only if Claude gives no review' > "$RUNNER_TEMP/pi-model.txt"
            echo "claude-first: pi skipped here, Claude reviews first"
            exit 0
          fi
          # Written BEFORE the loop: if the job is killed mid-attempt (job timeout), the
          # Claude fallback still sees a chain with no answer and runs.
          printf 'NONE — no model finished: %s' "$PI_MODELS" > "$RUNNER_TEMP/pi-model.txt"
          # Per-attempt limit: a hung model must fall through, not use up the job timeout.
          if [ "${PI_ATTEMPT_TIMEOUT_MINUTES:-0}" != "0" ]; then
            _limit="${PI_ATTEMPT_TIMEOUT_MINUTES}m"
          else
            _n=${#_models[@]}
            [ "$_n" -lt 1 ] && _n=1
            _secs=$(( (${JOB_TIMEOUT_MINUTES:-20} * 60 - 180) / _n ))
            [ "$_secs" -lt 120 ] && _secs=120
            _limit="${_secs}s"
          fi
          used=""
          for _m in "${_models[@]}"; do
            echo "::group::pi attempt — $_m (limit $_limit)"
            _rc=0
            timeout --kill-after=30s "$_limit" \
              pi -p --mode json --no-session --no-approve --exclude-tools edit,write \
              --model "$_m" \
              "$(cat "$RUNNER_TEMP/prompt.md")" \
              < "$RUNNER_TEMP/pr.diff" \
              > "$RUNNER_TEMP/pi-events.jsonl" || _rc=$?
            if [ "$_rc" = 124 ] || [ "$_rc" = 137 ]; then
              echo "pi attempt timed out after $_limit"
            elif [ "$_rc" != 0 ]; then
              echo "pi exited non-zero (see events)"
            fi
            if python3 "$RUNNER_TEMP/pi-extract-review.py" "$RUNNER_TEMP/pi-events.jsonl" \
                 > "$RUNNER_TEMP/pi-review.md"; then
              used="$_m"
              echo "::endgroup::"
              echo "usable review from $_m"
              break
            fi
            echo "::endgroup::"
            echo "no usable review from $_m — falling through to the next model"
          done
          # On total exhaustion pi-review.md holds the LAST attempt's failure body,
          # so the failure signal (marker + banner + cause) still reaches the comment.
          if [ -n "$used" ]; then
            printf '%s' "$used" > "$RUNNER_TEMP/pi-model.txt"
          else
            printf 'NONE — every model failed: %s' "$PI_MODELS" > "$RUNNER_TEMP/pi-model.txt"
          fi
          echo "model used: $(cat "$RUNNER_TEMP/pi-model.txt")"
          echo "review chars: $(wc -c < "$RUNNER_TEMP/pi-review.md")"

      - name: Upload late pi review artifact
        if: always() && steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pi-late-review-${{ needs.gate.outputs.pr_number }}
          path: |
            ${{ runner.temp }}/pi-review.md
            ${{ runner.temp }}/pi-model.txt
          retention-days: 3
          if-no-files-found: warn

  post:
    needs: [gate, review, claude-fallback, pi-after-claude]
    # Run when the review was ATTEMPTED (success or failure — never skip its own red
    # signal), or when Gate 2 skipped the PR and a note is wanted. A gate that decided
    # ci-not-green / not-reviewable / already-reviewed, or refused a rebuttal re-review,
    # posts nothing.
    if: >-
      always() && needs.gate.result == 'success' &&
      (
        needs.review.result != 'skipped' ||
        (needs.gate.outputs.skip_reason == 'docs-only' && inputs.skip-comment)
      )
    runs-on: ${{ inputs.runs-on }}
    # Bounded like `review`. Without this, GitHub's 360-minute default applies —
    # and because `runs-on` is a SELF-HOSTED runner, a hung job holds a finite
    # runner slot for six hours rather than just burning hosted minutes. This job
    # only downloads an artifact and posts a comment (~12s in practice), so the
    # shared 20-minute ceiling is enormously generous and still caps the damage.
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Download review artifact
        if: needs.review.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: pi-review-${{ needs.gate.outputs.pr_number }}
          path: ${{ runner.temp }}/review
        continue-on-error: true

      - name: Download Claude fallback artifact
        if: needs.claude-fallback.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: claude-review-${{ needs.gate.outputs.pr_number }}
          path: ${{ runner.temp }}/claude
        continue-on-error: true

      - name: Download late pi review artifact
        if: needs.pi-after-claude.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: pi-late-review-${{ needs.gate.outputs.pr_number }}
          path: ${{ runner.temp }}/late
        continue-on-error: true

      - name: Post PR comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          SKIP_REASON: ${{ needs.gate.outputs.skip_reason }}
          CLAUDE_FIRST: ${{ inputs.claude-first && inputs.claude-fallback-model != '' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs")
            const marker = "<!-- pi-pr-review -->"
            const failureMarker = "<!-- pi-pr-review-failed -->"
            const skipMarker = "<!-- pi-pr-review-skipped -->"
            const { owner, repo } = context.repo
            const issue_number = Number(process.env.PR_NUMBER)
            const headSha = process.env.HEAD_SHA
            const skipReason = process.env.SKIP_REASON || ""

            // Gate 2 skip note: upsert ONE comment so repeated docs pushes don't spam
            // the thread. Distinct marker so it never collides with the already-reviewed
            // detector (which keys on the review marker + "Reviewed commit:" line).
            if (skipReason === "docs-only") {
              const body = [
                skipMarker,
                "",
                "## 🧪 pi.dev Review — skipped",
                "",
                "_Every changed file matched this repo's docs/ops `skip-paths`, so no model " +
                  "review was run (cost gate). Push a change to a non-doc file to trigger a review._",
                "",
                `Target commit: ${headSha}`,
              ].join("\n")
              let comments = []
              try {
                comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number, per_page: 100,
                })
              } catch (e) {
                core.warning(`Could not list comments for skip-note upsert: ${e.message}`)
              }
              const prior = comments
                .filter((c) => c.user && c.user.login === "github-actions[bot]" && (c.body || "").includes(skipMarker))
                .pop()
              if (prior) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body })
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body })
              }
              return
            }

            // Normal review path.
            // Name the model that ACTUALLY produced this review, not the configured
            // default — with a fallback chain those differ, and reporting the default
            // would misreport which model actually did the work.
            let modelUsed = "unknown"
            try {
              modelUsed = fs.readFileSync(process.env.RUNNER_TEMP + "/review/pi-model.txt", "utf8").trim() || "unknown"
            } catch (e) {}
            const fallbackFailureBody = [
              failureMarker,
              "",
              "## ⚠️ REVIEW DID NOT RUN",
              "",
              "pi produced no artifact — the review did not run.",
              "",
              "### Token Usage",
              "",
              "Input tokens: `0`",
              "Output tokens: `0`",
              "Reasoning tokens: `0`",
              "Cache read tokens: `0`",
              "Cache write tokens: `0`",
              "Total tokens: `0`",
            ].join("\n")
            let review
            try {
              const t = fs.readFileSync(process.env.RUNNER_TEMP + "/review/pi-review.md", "utf8").trim()
              review = t || fallbackFailureBody
            } catch (e) {
              review = fallbackFailureBody
            }
            // Claude-first mode: when Claude gave no usable review, pi-after-claude ran
            // the chain. Its result (a review, or the chain's failure body) replaces the
            // review job's placeholder.
            const claudeFirst = process.env.CLAUDE_FIRST === "true"
            try {
              const t = fs.readFileSync(process.env.RUNNER_TEMP + "/late/pi-review.md", "utf8").trim()
              if (t) {
                review = t
                modelUsed = fs.readFileSync(process.env.RUNNER_TEMP + "/late/pi-model.txt", "utf8").trim() || "unknown"
              }
            } catch (e) {}
            // Claude: present when it produced a usable review (first in claude-first
            // mode, else after every pi model failed). It replaces any failure body, so
            // the check goes green and the comment names the model that answered.
            let viaClaude = false
            try {
              const c = fs.readFileSync(process.env.RUNNER_TEMP + "/claude/claude-review.md", "utf8").trim()
              if (c) {
                review = c
                viaClaude = true
                modelUsed = fs.readFileSync(process.env.RUNNER_TEMP + "/claude/claude-model.txt", "utf8").trim() || "claude (fallback)"
              }
            } catch (e) {}
            const body = [
              marker,
              "",
              viaClaude
                ? (claudeFirst ? "## 🧪 Claude Review" : "## 🧪 Claude Review (pi fallback)")
                : "## 🧪 pi.dev Review",
              "",
              viaClaude
                ? (claudeFirst
                    ? `_Automated review by Claude Code. Model: \`${modelUsed}\`. Advisory — address findings before merge._`
                    : `_Every pi model failed, so Claude reviewed this PR. Model: \`${modelUsed}\`. Advisory — address findings before merge._`)
                : claudeFirst
                  ? (review.includes(failureMarker)
                      ? `_Claude gave no usable review, and every pi model failed. Model: \`${modelUsed}\`._`
                      : `_Claude gave no usable review, so pi reviewed this PR. Model: \`${modelUsed}\`. Advisory — address findings before merge._`)
                  : `_Automated review by pi.dev. Model: \`${modelUsed}\`. Advisory — address findings before merge._`,
              "",
              // Which commit this review examined. Without it, a re-review of an
              // unchanged head is indistinguishable from a new review round, so
              // rounds-to-clean cannot be counted. The gate's already-reviewed
              // detector also keys on this exact line.
              `Reviewed commit: ${headSha}`,
              "",
              review,
            ].join("\n")
            // Publish the comment first (design D2: a red check must never be
            // left without its explanation).
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            })
            if (review.includes(failureMarker)) {
              core.setFailed("pi review did not run — see comment for details")
            }
